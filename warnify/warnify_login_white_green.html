<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Warnify Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <!-- Left panel -->
  <div class="left-panel">
    <div class="circle big"></div>
    <div class="circle small"></div>

    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#2e7d32">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
    </div>

    <h2>Your personal<br>study companion.</h2>
    <p class="subtitle">Track your progress, set goals,<br>and ace every exam.</p>

    <div class="stats">
      <div class="card">
        <div class="icon"></div>
        <div>
          <p class="label">Students enrolled</p>
          <p class="value">24,800+</p>
        </div>
      </div>

      <div class="card">
        <div class="icon"></div>
        <div>
          <p class="label">Average score boost</p>
          <p class="value">+34% in 30 days</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">

    <div class="header">
      <h3>Welcome back</h3>
      <p>Log in to continue studying</p>
    </div>

    <div class="input-group">
      <label>Email address</label>
      <input type="email" placeholder="you@example.com">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="••••••••">
    </div>

    <div class="forgot">Forgot password?</div>

    <button class="login-btn">Log in</button>

    <div class="divider">
      <div></div><span>OR</span><div></div>
    </div>

    <a href="warnify_signup_container.html">
      <button class="signup-btn">Create new account</button>
    </a>

    <p class="footer">© 2025 Warnify. All rights reserved.</p>

  </div>

</div>

</body>
</html>
